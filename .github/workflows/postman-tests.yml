name: Postman API Tests

on:
  schedule:
    # Run 3 times daily: at 00:00, 08:00, and 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra
      
      - name: Run Postman Collection and Generate Reports
        run: newman run "Restful Booker.postman_collection.json" --reporters cli,json,htmlextra --reporter-json-export newman-report.json --reporter-htmlextra-export postman-test-report.html
        continue-on-error: true
      
      - name: Generate Test Summary
        if: always()
        run: node generate-summary.js
        continue-on-error: true
      
      - name: Read Summary and Send to Slack
        if: always()
        run: |
          if [ -f qa-summary.txt ]; then
            SUMMARY=$(cat qa-summary.txt)
            SUMMARY="${SUMMARY//$'\n'/'\\n'}"
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$SUMMARY\"}"
          else
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d '{"text":"Test Summary: No summary file generated"}'
          fi
        shell: bash
        continue-on-error: true
      
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-results
          path: |
            postman-test-report.html
            qa-summary.txt
            newman-report.json
