name: Postman API Tests

on:
  schedule:
    # Run 3 times daily: at 00:00, 08:00, and 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra
      
      - name: Run Postman Collection and Generate Reports
        run: newman run "Restful Booker.postman_collection.json" --reporters cli,json,htmlextra --reporter-json-export newman-report.json --reporter-htmlextra-export postman-test-report.html
        continue-on-error: true
      
      - name: Generate Test Summary
        if: always()
        run: node generate-summary.js
        continue-on-error: true
      
      - name: Read Summary for Slack
        if: always()
        id: summary
        run: echo "SUMMARY<<EOF" >> $GITHUB_ENV && cat qa-summary.txt >> $GITHUB_ENV && echo "EOF" >> $GITHUB_ENV
        shell: bash
        continue-on-error: true
      
      - name: Send Summary to Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ env.SUMMARY }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
      
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-results
          path: |
            postman-test-report.html
            qa-summary.txt
            newman-report.json
